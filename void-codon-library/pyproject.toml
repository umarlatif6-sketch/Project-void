[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "void-codon-library"
version = "0.1.0"
description = "Standalone Project VOID codon library for platform and SCL-LBN codex lookup."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Umar Latif" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["void_codon_library*"]
