services:
  init:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://void:void@db:5432/void_db}
      VOID_RUN_STARTUP_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "scripts/run_startup_migrations.py"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://void:void@db:5432/void_db}
      PORT: 5000
      VOID_RUN_STARTUP_MIGRATIONS: "false"
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-void_db}
      POSTGRES_USER: ${POSTGRES_USER:-void}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-void}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-void} -d ${POSTGRES_DB:-void_db}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ops:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["ops"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://void:void@db:5432/void_db}
      VOID_RUN_STARTUP_MIGRATIONS: "false"
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash"]
    stdin_open: true
    tty: true

  proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${PROXY_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data: