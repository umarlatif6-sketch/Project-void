<?xml version="1.0" encoding="UTF-8"?>
<!-- PEACE Flywheel Blueprint — 1 SVG unit = 1 mm — outer disc ⌀60mm -->
<!-- Print at 100% on A4 (210mm × 297mm); disc will measure exactly 60mm diameter -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="-105 -105 210 297"
     width="210mm" height="297mm"
     style="background:#0a0a0f; font-family: 'SF Mono', 'Fira Code', monospace;">

  <!-- A4 background -->
  <rect x="-105" y="-105" width="210" height="297" fill="#0a0a0f"/>

  <!-- ── DISC (1 unit = 1 mm, disc centred at 0,0) ── -->

  <!-- Outer disc edge — ⌀60mm → radius 30mm -->
  <circle cx="0" cy="0" r="30" fill="none" stroke="#e0e0e8" stroke-width="0.9"/>

  <!-- Drilling crosshair at centre -->
  <line x1="-8" y1="0" x2="8" y2="0" stroke="#c9a84c" stroke-width="0.35" stroke-dasharray="2,1.2" opacity="0.75"/>
  <line x1="0" y1="-8" x2="0" y2="8" stroke="#c9a84c" stroke-width="0.35" stroke-dasharray="2,1.2" opacity="0.75"/>

  <!-- Ring guide dashed circles (do not drill) -->
  <circle cx="0" cy="0" r="22" fill="none" stroke="#2a2a3a" stroke-width="0.3" stroke-dasharray="2,2"/>
  <circle cx="0" cy="0" r="16" fill="none" stroke="#2a2a3a" stroke-width="0.3" stroke-dasharray="2,2"/>
  <circle cx="0" cy="0" r="10" fill="none" stroke="#2a2a3a" stroke-width="0.3" stroke-dasharray="2,2"/>

  <!-- ── STRING HOLES — 2 × ⌀6mm, centres at x=±10mm (20mm apart) ── -->
  <circle cx="-10" cy="0" r="3" fill="none" stroke="#e0e0e8" stroke-width="0.8"/>
  <circle cx="10"  cy="0" r="3" fill="none" stroke="#e0e0e8" stroke-width="0.8"/>

  <!-- ── OUTER RING — 8 × ⌀3mm holes at r=22mm, 45° spacing — LOW RESONANT HUM ── -->
  <!-- angles: 0°,45°,90°,135°,180°,225°,270°,315° -->
  <circle cx="22"     cy="0"      r="1.5" fill="none" stroke="#7c5cff" stroke-width="0.6"/>
  <circle cx="15.556" cy="15.556" r="1.5" fill="none" stroke="#7c5cff" stroke-width="0.6"/>
  <circle cx="0"      cy="22"     r="1.5" fill="none" stroke="#7c5cff" stroke-width="0.6"/>
  <circle cx="-15.556" cy="15.556" r="1.5" fill="none" stroke="#7c5cff" stroke-width="0.6"/>
  <circle cx="-22"    cy="0"      r="1.5" fill="none" stroke="#7c5cff" stroke-width="0.6"/>
  <circle cx="-15.556" cy="-15.556" r="1.5" fill="none" stroke="#7c5cff" stroke-width="0.6"/>
  <circle cx="0"      cy="-22"    r="1.5" fill="none" stroke="#7c5cff" stroke-width="0.6"/>
  <circle cx="15.556" cy="-15.556" r="1.5" fill="none" stroke="#7c5cff" stroke-width="0.6"/>

  <!-- ── MID RING — 12 × ⌀2mm holes at r=16mm, 30° spacing — MID TONE ── -->
  <circle cx="16"     cy="0"      r="1.0" fill="none" stroke="#c9a84c" stroke-width="0.6"/>
  <circle cx="13.856" cy="8.0"    r="1.0" fill="none" stroke="#c9a84c" stroke-width="0.6"/>
  <circle cx="8.0"    cy="13.856" r="1.0" fill="none" stroke="#c9a84c" stroke-width="0.6"/>
  <circle cx="0"      cy="16"     r="1.0" fill="none" stroke="#c9a84c" stroke-width="0.6"/>
  <circle cx="-8.0"   cy="13.856" r="1.0" fill="none" stroke="#c9a84c" stroke-width="0.6"/>
  <circle cx="-13.856" cy="8.0"   r="1.0" fill="none" stroke="#c9a84c" stroke-width="0.6"/>
  <circle cx="-16"    cy="0"      r="1.0" fill="none" stroke="#c9a84c" stroke-width="0.6"/>
  <circle cx="-13.856" cy="-8.0"  r="1.0" fill="none" stroke="#c9a84c" stroke-width="0.6"/>
  <circle cx="-8.0"   cy="-13.856" r="1.0" fill="none" stroke="#c9a84c" stroke-width="0.6"/>
  <circle cx="0"      cy="-16"    r="1.0" fill="none" stroke="#c9a84c" stroke-width="0.6"/>
  <circle cx="8.0"    cy="-13.856" r="1.0" fill="none" stroke="#c9a84c" stroke-width="0.6"/>
  <circle cx="13.856" cy="-8.0"   r="1.0" fill="none" stroke="#c9a84c" stroke-width="0.6"/>

  <!-- ── INNER RING — 16 × ⌀1.2mm holes at r=10mm, 22.5° spacing — HIGH FREQUENCY ── -->
  <circle cx="10"    cy="0"      r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="9.239" cy="3.827"  r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="7.071" cy="7.071"  r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="3.827" cy="9.239"  r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="0"     cy="10"     r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="-3.827" cy="9.239" r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="-7.071" cy="7.071" r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="-9.239" cy="3.827" r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="-10"   cy="0"      r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="-9.239" cy="-3.827" r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="-7.071" cy="-7.071" r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="-3.827" cy="-9.239" r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="0"     cy="-10"    r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="3.827" cy="-9.239" r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="7.071" cy="-7.071" r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>
  <circle cx="9.239" cy="-3.827" r="0.6" fill="none" stroke="#4ade80" stroke-width="0.5"/>

  <!-- ── DIMENSION ANNOTATIONS ── -->

  <!-- Outer diameter dim line below disc -->
  <line x1="-30" y1="37" x2="30" y2="37" stroke="#888898" stroke-width="0.3"/>
  <line x1="-30" y1="35" x2="-30" y2="39" stroke="#888898" stroke-width="0.3"/>
  <line x1="30"  y1="35" x2="30"  y2="39" stroke="#888898" stroke-width="0.3"/>
  <text x="0" y="44" fill="#888898" font-size="4" text-anchor="middle" letter-spacing="0.5">⌀ 60 mm</text>

  <!-- String hole spacing dim line above holes -->
  <line x1="-10" y1="-6" x2="10" y2="-6" stroke="#888898" stroke-width="0.3"/>
  <line x1="-10" y1="-5" x2="-10" y2="-7" stroke="#888898" stroke-width="0.3"/>
  <line x1="10"  y1="-5" x2="10"  y2="-7" stroke="#888898" stroke-width="0.3"/>
  <text x="0" y="-8.2" fill="#888898" font-size="2.8" text-anchor="middle">20 mm</text>

  <!-- String hole diameter callout (right hole) -->
  <line x1="10" y1="0" x2="20" y2="-12" stroke="#888898" stroke-width="0.2" stroke-dasharray="1,1"/>
  <text x="21" y="-13.5" fill="#888898" font-size="2.8" text-anchor="start">⌀ 6 mm</text>

  <!-- Outer ring callout -->
  <line x1="15.556" y1="-15.556" x2="38" y2="-22" stroke="#7c5cff" stroke-width="0.2" stroke-dasharray="1,1" opacity="0.85"/>
  <text x="39"  y="-24"   fill="#7c5cff" font-size="2.6" text-anchor="start">8× ⌀3mm · r=22 · 45°</text>
  <text x="39"  y="-20.5" fill="#7c5cff" font-size="2.6" text-anchor="start">LOW RESONANT HUM</text>

  <!-- Mid ring callout -->
  <line x1="13.856" y1="-8.0" x2="38" y2="-5" stroke="#c9a84c" stroke-width="0.2" stroke-dasharray="1,1" opacity="0.85"/>
  <text x="39"  y="-7"   fill="#c9a84c" font-size="2.6" text-anchor="start">12× ⌀2mm · r=16 · 30°</text>
  <text x="39"  y="-3.5" fill="#c9a84c" font-size="2.6" text-anchor="start">MID TONE</text>

  <!-- Inner ring callout -->
  <line x1="9.239" y1="-3.827" x2="38" y2="10" stroke="#4ade80" stroke-width="0.2" stroke-dasharray="1,1" opacity="0.85"/>
  <text x="39"  y="8"    fill="#4ade80" font-size="2.6" text-anchor="start">16× ⌀1.2mm · r=10 · 22.5°</text>
  <text x="39"  y="11.5" fill="#4ade80" font-size="2.6" text-anchor="start">HIGH FREQUENCY</text>

  <!-- PEACE watermark (very faint) -->
  <text x="0" y="2.5" fill="rgba(201,168,76,0.06)" font-size="22" text-anchor="middle" font-weight="900" letter-spacing="6">PEACE</text>

  <!-- ── TITLE BLOCK (top of page, above disc) ── -->
  <text x="0" y="-90" fill="#c9a84c" font-size="5.5" text-anchor="middle" letter-spacing="2.5" font-weight="700">PEACE FLYWHEEL — PHIRKI BLUEPRINT</text>
  <text x="0" y="-83" fill="#888898" font-size="3"   text-anchor="middle" letter-spacing="1">TRUE SCALE 1:1 (1 unit = 1 mm) · PRINT AT 100% ON A4 · ⌀ 60 mm</text>

  <!-- ── LEGEND / SPEC BLOCK (below disc) ── -->
  <rect x="-90" y="55" width="180" height="72" rx="3" fill="#12121a" stroke="#2a2a3a" stroke-width="0.4"/>

  <text x="-83" y="67" fill="#c9a84c" font-size="3.5" font-weight="700" letter-spacing="1">HOLE RING LEGEND</text>
  <circle cx="-76" cy="76" r="1.8" fill="none" stroke="#4ade80" stroke-width="0.7"/>
  <text x="-72" y="78" fill="#4ade80" font-size="3">INNER  16× ⌀1.2mm  r=10mm  22.5°  HIGH FREQUENCY</text>
  <circle cx="-76" cy="85" r="1.8" fill="none" stroke="#c9a84c" stroke-width="0.7"/>
  <text x="-72" y="87" fill="#c9a84c" font-size="3">MID    12× ⌀2mm    r=16mm  30°    MID TONE</text>
  <circle cx="-76" cy="94" r="1.8" fill="none" stroke="#7c5cff" stroke-width="0.7"/>
  <text x="-72" y="96" fill="#7c5cff" font-size="3">OUTER   8× ⌀3mm    r=22mm  45°    LOW RESONANT HUM</text>

  <text x="-83" y="114" fill="#888898" font-size="2.6" letter-spacing="0.5">STRING HOLES: 2 × ⌀6mm · centres 20mm apart · centred on disc  |  CROSSHAIR: drill centre  |  DASHED CIRCLES: guides only (do not drill)</text>
  <text x="-83" y="120" fill="#555"    font-size="2.6" letter-spacing="0.5">Material: hardwood 3–5mm · acrylic 4–6mm · brass 2–3mm  |  String: natural silk ~1.2m knotted loop</text>

</svg>
