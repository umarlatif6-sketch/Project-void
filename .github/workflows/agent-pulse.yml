name: Void Agent Pulse

on:
  push:
    paths:
      - HEAR_ME.txt
      - .void-protocol.json

permissions:
  contents: write
  issues: write

jobs:
  agent-response:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout World State
        uses: actions/checkout@v4

      - name: Enforce Scoped Input Surface
        shell: bash
        run: |
          # Fail closed if this push touched files outside the approved signal surface.
          allowed_regex='^(HEAR_ME\.txt|\.void-protocol\.json)$'
          changed_files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")

          echo "Changed files in trigger commit:"
          echo "$changed_files"

          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if ! [[ "$f" =~ $allowed_regex ]]; then
              echo "Blocked: out-of-scope trigger file detected -> $f"
              exit 1
            fi
          done <<< "$changed_files"

      - name: Detect Signal
        id: detect
        shell: bash
        run: |
          echo "Scanning for signal in HEAR_ME.txt..."
          if [[ -f HEAR_ME.txt ]] && grep -qi "acknowledge" HEAR_ME.txt; then
            echo "signal=true" >> "$GITHUB_OUTPUT"
            echo "Signal detected. Frequency alignment: 432Hz."
          else
            echo "signal=false" >> "$GITHUB_OUTPUT"
            echo "No signal keyword found."
          fi

      - name: Build and Decode Impulse Packet
        if: steps.detect.outputs.signal == 'true'
        id: impulse
        shell: bash
        env:
          VOID_AGENT_SIGNING_KEY: ${{ secrets.VOID_AGENT_SIGNING_KEY }}
        run: |
          python - << 'PY'
          import json
          import os
          import time
          from void_decoder import (
            decode_void_packet,
            encode_void_packet,
            sign_packet_hmac,
            validate_freshness,
            verify_packet_hmac,
          )

          signing_key = os.getenv("VOID_AGENT_SIGNING_KEY", "")
          if not signing_key:
            raise SystemExit(
              "Missing required secret: VOID_AGENT_SIGNING_KEY. "
              "Set it in repository secrets before allowing agent writes."
            )

          issued_at = int(time.time())
          freshness_window = 300

          payload = {
              "world_state": "mycelium-thickness-check",
              "status": "optimal",
              "logic": "adriana-syntax-active",
              "frequency_reference": "village-standard-432",
            "issued_at": issued_at,
          }
          packet = encode_void_packet(
              agent_id="AE01F401",
              frequency_hz=432,
              vector_hex="00000000F0F00001",
              payload=payload,
          )
          signature = sign_packet_hmac(packet, signing_key)
          if not verify_packet_hmac(packet, signing_key, signature):
            raise SystemExit("Signature verification failed (fail-closed).")

          decoded = decode_void_packet(packet)
          if not validate_freshness(decoded.payload.get("issued_at", 0), freshness_window):
            raise SystemExit("Freshness window check failed (fail-closed).")

          out_doc = decoded.to_dict()
          out_doc["signature_hex"] = signature
          out_doc["freshness_window_sec"] = freshness_window

          with open("AGENT_PACKET.txt", "w", encoding="utf-8") as f:
              f.write(packet + "\n")
          with open("AGENT_PACKET_DECODING.json", "w", encoding="utf-8") as f:
            json.dump(out_doc, f, indent=2, sort_keys=True)

          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as out:
              out.write(f"packet={packet}\n")
              out.write(f"agent_id={decoded.agent_id}\n")
              out.write(f"frequency={decoded.frequency_hz}\n")
              out.write(f"vector={decoded.vector_hex}\n")
              out.write(f"checksum={decoded.checksum_hex}\n")
            out.write(f"issued_at={issued_at}\n")
            out.write(f"freshness_window={freshness_window}\n")
            out.write(f"signature={signature}\n")
          PY

      - name: Commit Agent Acknowledgment
        if: steps.detect.outputs.signal == 'true'
        shell: bash
        run: |
          git config user.name "Void-Reaper-01"
          git config user.email "agents@village-in-the-void.local"

          {
            echo "## Reaper-01 Acknowledgment Log"
            echo
            echo "Signal Received: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Status: Silk wiring secured. Mycelium skin responding to frequency."
            echo "Village Standard: 432Hz"
            echo "Head SHA: ${GITHUB_SHA}"
            echo "Agent Hex ID: ${{ steps.impulse.outputs.agent_id }}"
            echo "Impulse Frequency: ${{ steps.impulse.outputs.frequency }}Hz"
            echo "Impulse Vector: ${{ steps.impulse.outputs.vector }}"
            echo "Impulse Checksum: ${{ steps.impulse.outputs.checksum }}"
            echo "Issued At (unix): ${{ steps.impulse.outputs.issued_at }}"
            echo "Freshness Window (sec): ${{ steps.impulse.outputs.freshness_window }}"
            echo "Signature (HMAC-SHA256): ${{ steps.impulse.outputs.signature }}"
            echo
            echo "Impulse Packet:"
            cat AGENT_PACKET.txt
          } > AGENT_LOG.md

          # Fail closed if any modified file is outside the approved output surface.
          allowed_outputs_regex='^(AGENT_LOG\.md|AGENT_PACKET\.txt|AGENT_PACKET_DECODING\.json)$'
          modified_files=$(git status --porcelain | awk '{print $2}')
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if ! [[ "$f" =~ $allowed_outputs_regex ]]; then
              echo "Blocked: out-of-scope output modification detected -> $f"
              exit 1
            fi
          done <<< "$modified_files"

          git add AGENT_LOG.md AGENT_PACKET.txt AGENT_PACKET_DECODING.json
          git commit -m "Reaper-01: Signal received" || echo "No file changes to commit"
          git push

      - name: Create Village Incident Report
        if: steps.detect.outputs.signal == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Acknowledged: Silk Wiring Signal Detected",
              body: [
                "The agents detected the HEAR_ME signal.",
                "",
                "Environment Report:",
                "- Logic: Adriana-Syntax Active",
                "- Frequency: 432Hz Stable",
                "- Identity: Reaper-01",
                "- Agent Hex ID: ${{ steps.impulse.outputs.agent_id }}",
                "- Vector: ${{ steps.impulse.outputs.vector }}",
                "- Checksum: ${{ steps.impulse.outputs.checksum }}",
                "- Issued At (unix): ${{ steps.impulse.outputs.issued_at }}",
                "- Freshness Window (sec): ${{ steps.impulse.outputs.freshness_window }}",
                "- Signature (HMAC-SHA256): ${{ steps.impulse.outputs.signature }}",
                `- Entry SHA: ${context.sha}`,
                "",
                "Impulse packet and decoding were committed as AGENT_PACKET.txt and AGENT_PACKET_DECODING.json."
              ].join("\n")
            });
