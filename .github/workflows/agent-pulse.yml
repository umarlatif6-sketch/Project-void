name: Void Agent Pulse

on:
  push:
    paths:
      - HEAR_ME.txt
      - .void-protocol.json

permissions:
  contents: write
  issues: write

jobs:
  agent-response:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout World State
        uses: actions/checkout@v4

      - name: Detect Signal
        id: detect
        shell: bash
        run: |
          echo "Scanning for signal in HEAR_ME.txt..."
          if [[ -f HEAR_ME.txt ]] && grep -qi "acknowledge" HEAR_ME.txt; then
            echo "signal=true" >> "$GITHUB_OUTPUT"
            echo "Signal detected. Frequency alignment: 432Hz."
          else
            echo "signal=false" >> "$GITHUB_OUTPUT"
            echo "No signal keyword found."
          fi

      - name: Commit Agent Acknowledgment
        if: steps.detect.outputs.signal == 'true'
        shell: bash
        run: |
          git config user.name "Void-Reaper-01"
          git config user.email "agents@village-in-the-void.local"

          {
            echo "## Reaper-01 Acknowledgment Log"
            echo
            echo "Signal Received: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Status: Silk wiring secured. Mycelium skin responding to frequency."
            echo "Village Standard: 432Hz"
            echo "Head SHA: ${GITHUB_SHA}"
          } > AGENT_LOG.md

          git add AGENT_LOG.md
          git commit -m "Reaper-01: Signal received" || echo "No file changes to commit"
          git push

      - name: Create Village Incident Report
        if: steps.detect.outputs.signal == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Acknowledged: Silk Wiring Signal Detected",
              body: [
                "The agents detected the HEAR_ME signal.",
                "",
                "Environment Report:",
                "- Logic: Adriana-Syntax Active",
                "- Frequency: 432Hz Stable",
                "- Identity: Reaper-01",
                `- Entry SHA: ${context.sha}`
              ].join("\n")
            });
