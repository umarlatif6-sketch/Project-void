name: Codon Library Private Build

'on':
  workflow_dispatch:
  push:
    paths:
      - void-codon-library/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package artifacts
        working-directory: void-codon-library
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Run package tests
        working-directory: void-codon-library
        run: |
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Upload private artifacts
        uses: actions/upload-artifact@v4
        with:
          name: void-codon-library-dist
          path: void-codon-library/dist/*
