<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequency Disrupted — PROJECT VOID</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }
        .error-container { max-width: 480px; padding: 32px; }
        .error-glyph {
            font-size: 64px;
            color: #c9a84c;
            margin-bottom: 24px;
            opacity: 0.6;
        }
        .error-code {
            font-size: 72px;
            color: #e0e0e8;
            letter-spacing: 8px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .error-title {
            font-size: 18px;
            color: #c9a84c;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }
        .error-desc {
            font-size: 13px;
            color: #888898;
            line-height: 1.8;
            margin-bottom: 32px;
        }
        .error-link {
            display: inline-block;
            padding: 10px 28px;
            background: rgba(201, 168, 76, 0.08);
            border: 1px solid rgba(201, 168, 76, 0.3);
            border-radius: 8px;
            color: #c9a84c;
            text-decoration: none;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s;
        }
        .error-link:hover {
            background: rgba(201, 168, 76, 0.15);
            border-color: #c9a84c;
            box-shadow: 0 0 20px rgba(201, 168, 76, 0.15);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-glyph">&#9670;</div>
        <div class="error-code">500</div>
        <h1 class="error-title">Frequency Disrupted</h1>
        <p class="error-desc">An internal resonance fault has occurred. The system is recalibrating. This has been logged and the signal will be restored.</p>
        <a href="/launch" class="error-link">Return to Origin</a>
    </div>
</body>
</html>
