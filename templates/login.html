<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT VOID — Sovereign Access</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #06060a;
            --surface: #0d0d14;
            --surface2: #13131d;
            --border: #1a1a28;
            --gold: #c9a84c;
            --gold-dim: #8c7535;
            --gold-glow: rgba(201, 168, 76, 0.15);
            --teal: #2dd4bf;
            --white: #c8c8c8;
            --dim: #555;
            --red: #e74c3c;
            --green: #2d6a4f;
            --font: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            --echo-blue: #5e9cf0;
            --echo-purple: #a78bfa;
            --echo-glow: rgba(94, 156, 240, 0.15);
        }
        body {
            background: var(--bg);
            color: var(--white);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .portal-row {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            gap: 0;
            width: 100%;
            max-width: 900px;
            position: relative;
            z-index: 3;
        }
        .portal-divider {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 36px;
            flex-shrink: 0;
            gap: 8px;
        }
        .portal-divider-line {
            flex: 1;
            width: 1px;
            background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.08) 30%, rgba(255,255,255,0.08) 70%, transparent);
        }
        .portal-divider-label {
            font-size: 9px;
            letter-spacing: 2px;
            color: var(--dim);
            text-transform: uppercase;
            writing-mode: vertical-rl;
            padding: 4px 0;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 32px 32px;
            position: relative;
            box-shadow: 0 0 60px rgba(0,0,0,0.5);
            flex: 1;
        }
        .echo-card {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 32px 32px;
            position: relative;
            box-shadow: 0 0 60px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .echo-card-glow {
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: 12px;
            pointer-events: none;
            border: 1px solid rgba(94, 156, 240, 0.25);
            box-shadow: 0 0 40px rgba(94, 156, 240, 0.07), inset 0 0 40px rgba(167, 139, 250, 0.04);
        }
        .echo-logo-mark {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--echo-blue), var(--echo-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
            box-shadow: 0 0 30px rgba(94, 156, 240, 0.25);
        }
        .echo-brand {
            font-size: 20px;
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: bold;
            background: linear-gradient(90deg, var(--echo-blue), var(--echo-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .echo-tagline {
            font-size: 13px;
            color: var(--white);
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-style: italic;
            opacity: 0.85;
        }
        .echo-desc {
            font-size: 11px;
            color: var(--dim);
            letter-spacing: 1px;
            line-height: 1.6;
            margin-bottom: 32px;
            max-width: 280px;
        }
        .echo-cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--echo-blue), var(--echo-purple));
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: var(--font);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(94, 156, 240, 0.2);
        }
        .echo-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(94, 156, 240, 0.35);
        }
        .echo-footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            width: 100%;
            text-align: center;
        }
        .echo-footer p {
            font-size: 9px;
            color: var(--dim);
            letter-spacing: 2px;
        }
        @media (max-width: 767px) {
            .portal-row {
                flex-direction: column;
                max-width: 420px;
            }
            .portal-divider {
                flex-direction: row;
                width: 100%;
                height: 36px;
                gap: 8px;
            }
            .portal-divider-line {
                flex: 1;
                width: auto;
                height: 1px;
                background: linear-gradient(to right, transparent, rgba(255,255,255,0.08) 30%, rgba(255,255,255,0.08) 70%, transparent);
            }
            .portal-divider-label {
                writing-mode: horizontal-tb;
            }
        }
        .login-logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-logo-icon {
            font-size: 36px;
            color: var(--gold);
            text-shadow: 0 0 30px var(--gold-glow);
            margin-bottom: 12px;
        }
        .login-logo h1 {
            font-size: 20px;
            letter-spacing: 6px;
            color: var(--white);
            text-transform: uppercase;
        }
        .login-logo p {
            font-size: 11px;
            color: var(--gold-dim);
            letter-spacing: 3px;
            margin-top: 4px;
            text-transform: uppercase;
        }
        .login-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .login-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--dim);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: var(--font);
            text-transform: uppercase;
        }
        .login-tab:hover { color: var(--white); }
        .login-tab.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }
        .login-form { display: none; }
        .login-form.active { display: block; }
        .login-field {
            margin-bottom: 16px;
        }
        .login-field label {
            display: block;
            font-size: 10px;
            color: var(--dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .login-field input {
            width: 100%;
            padding: 12px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--white);
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .login-field input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 2px var(--gold-glow);
        }
        .login-field input::placeholder { color: var(--dim); font-size: 12px; }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-family: var(--font);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        .login-btn:hover {
            background: #d4b45a;
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .login-error {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: var(--red);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 16px;
            display: none;
        }
        .login-success {
            background: rgba(45, 106, 79, 0.1);
            border: 1px solid rgba(45, 106, 79, 0.3);
            color: var(--teal);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 16px;
            display: none;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .login-footer p {
            font-size: 9px;
            color: var(--dim);
            letter-spacing: 2px;
        }
        .login-footer a {
            color: var(--dim);
            text-decoration: none;
        }
        .login-footer a:hover { color: var(--teal); }
        .login-links {
            text-align: center;
            margin-top: 20px;
        }
        .login-links a {
            color: var(--dim);
            font-size: 11px;
            text-decoration: none;
            margin: 0 8px;
        }
        .login-links a:hover { color: var(--teal); }
        .login-border-glow {
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s;
            border: 1px solid var(--gold);
            box-shadow: 0 0 30px var(--gold-glow), inset 0 0 30px var(--gold-glow);
        }
        .login-card.founder-glow .login-border-glow {
            opacity: 1;
        }
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px 24px; }
            .login-logo h1 { font-size: 16px; letter-spacing: 4px; }
        }
        #blueprint-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .login-card {
            z-index: 3;
        }
        .echo-card {
            z-index: 3;
        }
        .login-links {
            position: relative;
            z-index: 3;
        }
    </style>
</head>
<body>
    <canvas id="blueprint-bg"></canvas>
    <div class="portal-row">
        <div class="login-card" id="login-card">
            <div class="login-border-glow"></div>
            <div class="login-logo">
                <div class="login-logo-icon">&#9670;</div>
                <h1>PROJECT VOID</h1>
                <p>Sovereign Access</p>
            </div>

            <div class="login-tabs">
                <button class="login-tab active" data-form="login-form">Login</button>
                <button class="login-tab" data-form="register-form">Register</button>
            </div>

            <div class="login-error" id="login-error"></div>
            <div class="login-success" id="login-success"></div>

            <form class="login-form active" id="login-form" onsubmit="return handleLogin(event)">
                <div class="login-field">
                    <label>Username</label>
                    <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username" required>
                </div>
                <div class="login-field">

                    <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" required>

                    <input type="text" id="reg-username" placeholder="Choose a username (3-50 chars)" autocomplete="username" required minlength="3" maxlength="50">
                </div>
                <div class="login-field">
                    <label>Display Name</label>
                    <input type="text" id="reg-display" placeholder="How others will see you">
                </div>
                <div class="login-field">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="Minimum 6 characters" autocomplete="new-password" required minlength="6">
                </div>
                <div class="login-field">
                    <label>Confirm Password</label>
                    <input type="password" id="reg-confirm" placeholder="Re-enter your password" autocomplete="new-password" required>
                </div>
                <button type="submit" class="login-btn" id="reg-btn">Create Account</button>
            </form>

            <div class="login-footer">
                <p>Al-Jabr 286 Sovereign Hash &middot; 432 Hz</p>
            </div>
        </div>

        <div class="portal-divider">
            <div class="portal-divider-line"></div>
            <span class="portal-divider-label">or</span>
            <div class="portal-divider-line"></div>
        </div>

        <div class="echo-card">
            <div class="echo-card-glow"></div>
            <div class="echo-logo-mark">&#9835;</div>
            <div class="echo-brand">VoidEcho</div>
            <div class="echo-tagline">Your document lives inside the music</div>
            <div class="echo-desc">Encode any file into audio — no account needed. Share the sound, retrieve the secret.</div>
            <a href="/voidecho" class="echo-cta">Send a Document &#8594;</a>
            <div class="echo-footer">
                <p>No login required &middot; Steganographic encoding</p>
            </div>
        </div>
    </div>

    <div class="login-links">
        <a href="/launch">Home</a>
        <a href="/guide">Guide</a>
        <a href="/demo">Demo</a>
        <a href="/grants">Grants</a>
    </div>

    <script>
    (function() {
        var tabs = document.querySelectorAll('.login-tab');
        var forms = document.querySelectorAll('.login-form');
        var errorEl = document.getElementById('login-error');
        var successEl = document.getElementById('login-success');

        tabs.forEach(function(tab) {
            tab.addEventListener('click', function() {
                tabs.forEach(function(t) { t.classList.remove('active'); });
                forms.forEach(function(f) { f.classList.remove('active'); });
                tab.classList.add('active');
                document.getElementById(tab.dataset.form).classList.add('active');
                errorEl.style.display = 'none';
                successEl.style.display = 'none';
            });
        });

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
            successEl.style.display = 'none';
        }
        function showSuccess(msg) {
            successEl.textContent = msg;
            successEl.style.display = 'block';
            errorEl.style.display = 'none';
        }

        window.handleLogin = function(e) {
            e.preventDefault();
            var btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = 'Authenticating...';
            errorEl.style.display = 'none';

            var username = document.getElementById('login-username').value.trim();
            var password = document.getElementById('login-password').value;

            fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: username, password: password})
            })
            .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
            .then(function(res) {
                if (res.ok) {
                    if (res.data.is_founder) {
                        document.getElementById('login-card').classList.add('founder-glow');
                        showSuccess('Welcome home, Founder.');
                        setTimeout(function() { window.location.href = '/'; }, 1200);
                    } else {
                        showSuccess('Access granted.');
                        setTimeout(function() { window.location.href = '/'; }, 600);
                    }
                } else {
                    showError(res.data.error || 'Login failed');
                    btn.disabled = false;
                    btn.textContent = 'Enter the Vault';
                }
            })
            .catch(function() {
                showError('Connection failed');
                btn.disabled = false;
                btn.textContent = 'Enter the Vault';
            });
            return false;
        };

        window.handleRegister = function(e) {
            e.preventDefault();
            var btn = document.getElementById('reg-btn');
            btn.disabled = true;
            btn.textContent = 'Creating...';
            errorEl.style.display = 'none';

            var username = document.getElementById('reg-username').value.trim();
            var display = document.getElementById('reg-display').value.trim();
            var password = document.getElementById('reg-password').value;
            var confirm = document.getElementById('reg-confirm').value;

            if (password !== confirm) {
                showError('Passwords do not match');
                btn.disabled = false;
                btn.textContent = 'Create Account';
                return false;
            }

            fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: username,
                    display_name: display,
                    password: password,
                    confirm_password: confirm
                })
            })
            .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
            .then(function(res) {
                if (res.ok) {
                    showSuccess('Account created. Entering the vault...');
                    setTimeout(function() { window.location.href = '/'; }, 800);
                } else {
                    showError(res.data.error || 'Registration failed');
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                }
            })
            .catch(function() {
                showError('Connection failed');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            });
            return false;
        };
    })();
    </script>

    (function() {

        var ctx = canvas.getContext('2d');

        var SYSTEMS = [

            },
            {

                sub:  ['DePIN Sovereign Tokens', 'Rare / Legendary Tiers', 'Manufacturing Slots', 'Yield Bearing'],
                rgb:  '252,129,74',
                glyphs: ['✦','⌖','⟩','◈','⊛'],
                ax: 0.92, ay: 0.62
            },
            {
                name: 'MYCOVOID',
                sub:  ['Mycelium Network', 'Radiation Remediation', 'Melanin Absorption', '50-80 Node Grid'],
                rgb:  '183,148,246',
                glyphs: ['ψ','Ω','φ','λ','∂'],
                ax: 0.12, ay: 0.83
            },
            {
                name: 'KINETIC FLYWHEEL',
                sub:  ['Proof of Motion', 'Calisthenics → VTX', 'Compute Credits', 'Body-Machine Link'],
                rgb:  '246,173,85',
                glyphs: ['θ','ζ','ε','π','◉'],
                ax: 0.88, ay: 0.83
            }
        ];

        SYSTEMS.forEach(function(s, i) { s.ph = i * Math.PI / 4; });

        var TEAL = '45,212,191';
        var GOLD  = '201,168,76';

        var W, H, t = 0, scanY = 0;
        var bgNodes = [], bgTraces = [];

        function rand(a, b) { return a + Math.random() * (b - a); }

        /* ── generate background circuit nodes (teal, decorative) ── */
        function generate() {
            bgNodes = []; bgTraces = [];
            var step = 150;
            for (var gx = step; gx < W; gx += step) {
                for (var gy = step; gy < H; gy += step) {
                    if (Math.random() < 0.20) {
                        bgNodes.push({ x: gx+rand(-50,50), y: gy+rand(-50,50),
                                       r: rand(1.8,3.8), ph: rand(0, Math.PI*2) });
                    }
                }
            }
            for (var i = 0; i < bgNodes.length; i++) {
                for (var j = i+1; j < bgNodes.length; j++) {
                    var dx = bgNodes[j].x - bgNodes[i].x,
                        dy = bgNodes[j].y - bgNodes[i].y;
                    if (dx*dx + dy*dy < 190*190 && Math.random() < 0.25)
                        bgTraces.push({ a: i, b: j });
                }
            }
        }

        /* ── helpers ── */
        function hexPath(cx, cy, r) {
            ctx.beginPath();
            for (var i = 0; i < 6; i++) {
                var a = Math.PI/3*i - Math.PI/6;
                i === 0 ? ctx.moveTo(cx+r*Math.cos(a), cy+r*Math.sin(a))
                        : ctx.lineTo(cx+r*Math.cos(a), cy+r*Math.sin(a));
            }
            ctx.closePath();
        }

        function drawCorner(x, y, sz, c) {
            var s = sz / 2;
            ctx.strokeStyle = 'rgba(' + GOLD + ',0.40)';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            if (c===0){ctx.moveTo(x+s,y);ctx.lineTo(x,y);ctx.lineTo(x,y+s);}
            if (c===1){ctx.moveTo(x-s,y);ctx.lineTo(x,y);ctx.lineTo(x,y+s);}
            if (c===2){ctx.moveTo(x+s,y);ctx.lineTo(x,y);ctx.lineTo(x,y-s);}
            if (c===3){ctx.moveTo(x-s,y);ctx.lineTo(x,y);ctx.lineTo(x,y-s);}
            ctx.stroke();
            ctx.beginPath(); ctx.arc(x, y, 3.5, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(' + GOLD + ',0.55)'; ctx.fill();
        }

        /* ── draw one system zone ── */
        function drawZone(sys, showLabels) {
            var cx  = sys.ax * W,  cy  = sys.ay * H;
            var rgb = sys.rgb;
            var pulse = 0.5 + 0.5 * Math.sin(t * 1.1 + sys.ph);
            var isLeft = sys.ax < 0.5;

            /* dashed L-shaped connection line to card centre */
            ctx.save();
            ctx.setLineDash([6, 11]);
            ctx.strokeStyle = 'rgba(' + rgb + ',0.22)';
            ctx.lineWidth = 1.0;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            var midX = isLeft ? W * 0.42 : W * 0.58;
            ctx.lineTo(midX, cy);
            ctx.lineTo(W * 0.5, H * 0.5);
            ctx.stroke();
            ctx.restore();

            /* radial glow */
            var gr = 70;
            var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, gr);
            grad.addColorStop(0, 'rgba(' + rgb + ',' + (0.10 + pulse * 0.09) + ')');
            grad.addColorStop(1, 'rgba(' + rgb + ',0)');
            ctx.fillStyle = grad;
            ctx.fillRect(cx - gr, cy - gr, gr * 2, gr * 2);

            /* hex rings */
            hexPath(cx, cy, 18);
            ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.22 + pulse * 0.22) + ')';
            ctx.lineWidth = 0.9; ctx.stroke();
            hexPath(cx, cy, 30);
            ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.12 + pulse * 0.12) + ')';
            ctx.lineWidth = 0.7; ctx.stroke();
            hexPath(cx, cy, 46);
            ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.06 + pulse * 0.06) + ')';
            ctx.lineWidth = 0.6; ctx.stroke();

            /* centre dot */
            ctx.beginPath(); ctx.arc(cx, cy, 5.5, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(' + rgb + ',' + (0.55 + pulse * 0.40) + ')'; ctx.fill();

            /* orbiting satellite nodes */
            for (var s = 0; s < 5; s++) {
                var sa  = (Math.PI * 2 / 5) * s + t * (isLeft ? 0.45 : -0.45);
                var sx  = cx + Math.cos(sa) * 24, sy = cy + Math.sin(sa) * 24;
                ctx.beginPath(); ctx.arc(sx, sy, 2.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(' + rgb + ',' + (0.35 + pulse * 0.35) + ')'; ctx.fill();
                ctx.beginPath();
                ctx.moveTo(sx-5,sy); ctx.lineTo(sx+5,sy);
                ctx.moveTo(sx,sy-5); ctx.lineTo(sx,sy+5);
                ctx.strokeStyle = 'rgba(' + rgb + ',' + (0.18 + pulse * 0.14) + ')';
                ctx.lineWidth = 0.65; ctx.stroke();
            }

            /* glyphs orbiting the hex ring */
            ctx.font = "14px 'SF Mono','Fira Code',monospace";
            sys.glyphs.forEach(function(g, i) {
                var ga = (Math.PI * 2 / sys.glyphs.length) * i + sys.ph + t * 0.06;
                ctx.fillStyle = 'rgba(' + rgb + ',' + (0.30 + pulse * 0.12) + ')';
                ctx.fillText(g, cx + Math.cos(ga) * 44 - 5, cy + Math.sin(ga) * 44 + 5);
            });

            if (!showLabels) return;

            /* system name */
            ctx.font = "bold 11px 'SF Mono','Fira Code',monospace";
            ctx.fillStyle = 'rgba(' + rgb + ',0.88)';
            var nw  = ctx.measureText(sys.name).width;
            var lx  = isLeft ? cx + 54 : cx - nw - 54;
            var ly  = cy - 28;
            ctx.fillText(sys.name, lx, ly);

            /* rule under name */
            ctx.beginPath();
            ctx.moveTo(lx, ly + 5); ctx.lineTo(lx + nw, ly + 5);
            ctx.strokeStyle = 'rgba(' + rgb + ',0.35)'; ctx.lineWidth = 0.8; ctx.stroke();

            /* sub-labels */
            ctx.font = "9.5px 'SF Mono','Fira Code',monospace";
            sys.sub.forEach(function(line, idx) {
                ctx.fillStyle = 'rgba(' + rgb + ',' + (idx === 0 ? 0.60 : 0.40) + ')';
                ctx.fillText('◦ ' + line, lx, ly + 19 + idx * 14);
            });
        }

        /* ── main animation loop ── */
        function frame() {
            ctx.clearRect(0, 0, W, H);
            t      += 0.007;
            scanY   = (scanY + 0.45) % H;
            var mobile = W < 900;

            /* fine grid */
            ctx.strokeStyle = 'rgba(' + TEAL + ',' + (mobile ? 0.05 : 0.09) + ')';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            for (var gx = 0; gx < W; gx += 50) { ctx.moveTo(gx,0); ctx.lineTo(gx,H); }
            for (var gy = 0; gy < H; gy += 50) { ctx.moveTo(0,gy); ctx.lineTo(W,gy); }
            ctx.stroke();

            /* major grid */
            ctx.strokeStyle = 'rgba(' + TEAL + ',' + (mobile ? 0.09 : 0.17) + ')';
            ctx.lineWidth = 0.7;
            ctx.beginPath();
            for (var mx = 0; mx < W; mx += 250) { ctx.moveTo(mx,0); ctx.lineTo(mx,H); }
            for (var my = 0; my < H; my += 250) { ctx.moveTo(0,my); ctx.lineTo(W,my); }
            ctx.stroke();

            /* corner brackets */
            drawCorner(28, 28, 60, 0); drawCorner(W-28, 28, 60, 1);
            drawCorner(28, H-28, 60, 2); drawCorner(W-28, H-28, 60, 3);

            /* mid-edge diamonds */
            [{x:W*.5,y:18},{x:W*.5,y:H-18},{x:18,y:H*.5},{x:W-18,y:H*.5}].forEach(function(d){
                var sz = 10;
                ctx.beginPath();
                ctx.moveTo(d.x,d.y-sz); ctx.lineTo(d.x+sz,d.y);
                ctx.lineTo(d.x,d.y+sz); ctx.lineTo(d.x-sz,d.y);
                ctx.closePath();
                ctx.strokeStyle='rgba('+GOLD+',0.35)'; ctx.lineWidth=1.1; ctx.stroke();
            });

            /* background circuit nodes & traces */
            bgTraces.forEach(function(tr) {
                var a = bgNodes[tr.a], b = bgNodes[tr.b];
                ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x,b.y); ctx.lineTo(b.x,b.y);
                ctx.strokeStyle = 'rgba('+TEAL+',0.07)'; ctx.lineWidth = 0.6; ctx.stroke();
            });
            bgNodes.forEach(function(n) {
                var p = 0.5 + 0.5*Math.sin(t*1.5+n.ph), op = 0.07 + p*0.10;
                ctx.strokeStyle = 'rgba('+TEAL+','+op+')';
                ctx.fillStyle   = 'rgba('+TEAL+','+(op*0.28)+')';
                ctx.lineWidth = 0.7;
                ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(n.x-n.r*2.3,n.y); ctx.lineTo(n.x+n.r*2.3,n.y);
                ctx.moveTo(n.x,n.y-n.r*2.3); ctx.lineTo(n.x,n.y+n.r*2.3);
                ctx.stroke();
            });

            /* system zones */
            SYSTEMS.forEach(function(sys) { drawZone(sys, !mobile); });

            /* scan line */
            var sg = ctx.createLinearGradient(0, scanY-55, 0, scanY+55);
            sg.addColorStop(0,   'rgba('+TEAL+',0)');
            sg.addColorStop(0.5, 'rgba('+TEAL+',0.055)');
            sg.addColorStop(1,   'rgba('+TEAL+',0)');
            ctx.fillStyle = sg; ctx.fillRect(0, scanY-55, W, 110);

            requestAnimationFrame(frame);
        }

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() { resize(); generate(); }, 300);
        });

        resize(); generate(); requestAnimationFrame(frame);
    })();
    </script>
    <script src="/static/resonance_visualizer.js"></script>
    <script>
    (function() {
        if (typeof ResonanceField === 'undefined') return;
        var bg = document.createElement('div');
        bg.id = 'login-resonance-bg';
        bg.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;';
        document.body.insertBefore(bg, document.body.firstChild);
        var rf = new ResonanceField(bg, { founder: false });
        rf.canvas.style.opacity = '0.4';
        function ambientPulse() {
            var seed = '';
            for (var i = 0; i < 16; i++) seed += Math.floor(Math.random() * 16).toString(16);
            rf.activate(seed, 'ambient');
            setTimeout(function() {
                rf.active = false;
            }, 3000);
            setTimeout(ambientPulse, 5000 + Math.random() * 3000);
        }
        setTimeout(ambientPulse, 1500);

        var origLogin = window.handleLogin;
        window.handleLogin = function(e) {
            var result = origLogin(e);
            return result;
        };

        var origSuccess = null;
        var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(m) {
                if (m.target.id === 'login-card' && m.target.classList.contains('founder-glow')) {
                    rf.opts.founder = true;
                    rf.isFounder = true;
                    rf.canvas.style.opacity = '0.8';
                    for (var i = 0; i < 3; i++) {
                        setTimeout(function() { rf.pulseHash('c9a84cfounder432adriana'); }, i * 400);
                    }
                }
            });
        });
        var card = document.getElementById('login-card');
        if (card) observer.observe(card, { attributes: true, attributeFilter: ['class'] });
    })();
    </script>
