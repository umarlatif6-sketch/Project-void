<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT VOID — Sovereign Access</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #06060a;
            --surface: #0d0d14;
            --surface2: #13131d;
            --border: #1a1a28;
            --gold: #c9a84c;
            --gold-dim: #8c7535;
            --gold-glow: rgba(201, 168, 76, 0.15);
            --teal: #2dd4bf;
            --white: #c8c8c8;
            --dim: #555;
            --red: #e74c3c;
            --green: #2d6a4f;
            --font: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
        }
        body {
            background: var(--bg);
            color: var(--white);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 32px 32px;
            position: relative;
            box-shadow: 0 0 60px rgba(0,0,0,0.5);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-logo-icon {
            font-size: 36px;
            color: var(--gold);
            text-shadow: 0 0 30px var(--gold-glow);
            margin-bottom: 12px;
        }
        .login-logo h1 {
            font-size: 20px;
            letter-spacing: 6px;
            color: var(--white);
            text-transform: uppercase;
        }
        .login-logo p {
            font-size: 11px;
            color: var(--gold-dim);
            letter-spacing: 3px;
            margin-top: 4px;
            text-transform: uppercase;
        }
        .login-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }
        .login-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--dim);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
            background: none;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: var(--font);
            text-transform: uppercase;
        }
        .login-tab:hover { color: var(--white); }
        .login-tab.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }
        .login-form { display: none; }
        .login-form.active { display: block; }
        .login-field {
            margin-bottom: 16px;
        }
        .login-field label {
            display: block;
            font-size: 10px;
            color: var(--dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .login-field input {
            width: 100%;
            padding: 12px 14px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--white);
            font-family: var(--font);
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .login-field input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 2px var(--gold-glow);
        }
        .login-field input::placeholder { color: var(--dim); font-size: 12px; }
        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--gold);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            font-family: var(--font);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }
        .login-btn:hover {
            background: #d4b45a;
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .login-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .login-error {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: var(--red);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 16px;
            display: none;
        }
        .login-success {
            background: rgba(45, 106, 79, 0.1);
            border: 1px solid rgba(45, 106, 79, 0.3);
            color: var(--teal);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 16px;
            display: none;
        }
        .login-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .login-footer p {
            font-size: 9px;
            color: var(--dim);
            letter-spacing: 2px;
        }
        .login-footer a {
            color: var(--dim);
            text-decoration: none;
        }
        .login-footer a:hover { color: var(--teal); }
        .login-links {
            text-align: center;
            margin-top: 20px;
        }
        .login-links a {
            color: var(--dim);
            font-size: 11px;
            text-decoration: none;
            margin: 0 8px;
        }
        .login-links a:hover { color: var(--teal); }
        .login-border-glow {
            position: absolute;
            top: -1px; left: -1px; right: -1px; bottom: -1px;
            border-radius: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s;
            border: 1px solid var(--gold);
            box-shadow: 0 0 30px var(--gold-glow), inset 0 0 30px var(--gold-glow);
        }
        .login-card.founder-glow .login-border-glow {
            opacity: 1;
        }
        @media (max-width: 480px) {
            .login-card { padding: 28px 20px 24px; }
            .login-logo h1 { font-size: 16px; letter-spacing: 4px; }
        }
        #blueprint-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .login-card {
            z-index: 3;
        }
        .login-links {
            position: relative;
            z-index: 3;
        }
    </style>
</head>
<body>
    <canvas id="blueprint-bg"></canvas>
    <div class="login-card" id="login-card">
        <div class="login-border-glow"></div>
        <div class="login-logo">
            <div class="login-logo-icon">&#9670;</div>
            <h1>PROJECT VOID</h1>
            <p>Sovereign Access</p>
        </div>

        <div class="login-tabs">
            <button class="login-tab active" data-form="login-form">Login</button>
            <button class="login-tab" data-form="register-form">Register</button>
        </div>

        <div class="login-error" id="login-error"></div>
        <div class="login-success" id="login-success"></div>

        <form class="login-form active" id="login-form" onsubmit="return handleLogin(event)">
            <div class="login-field">
                <label>Username</label>
                <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username" required>
            </div>
            <div class="login-field">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="login-btn" id="login-btn">Enter the Vault</button>
        </form>

        <form class="login-form" id="register-form" onsubmit="return handleRegister(event)">
            <div class="login-field">
                <label>Username</label>
                <input type="text" id="reg-username" placeholder="Choose a username (3-50 chars)" autocomplete="username" required minlength="3" maxlength="50">
            </div>
            <div class="login-field">
                <label>Display Name</label>
                <input type="text" id="reg-display" placeholder="How others will see you">
            </div>
            <div class="login-field">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="Minimum 6 characters" autocomplete="new-password" required minlength="6">
            </div>
            <div class="login-field">
                <label>Confirm Password</label>
                <input type="password" id="reg-confirm" placeholder="Re-enter your password" autocomplete="new-password" required>
            </div>
            <button type="submit" class="login-btn" id="reg-btn">Create Account</button>
        </form>

        <div class="login-footer">
            <p>Al-Jabr 286 Sovereign Hash &middot; 432 Hz</p>
        </div>
    </div>

    <div class="login-links">
        <a href="/launch">Home</a>
        <a href="/guide">Guide</a>
        <a href="/demo">Demo</a>
        <a href="/grants">Grants</a>
    </div>

    <script>
    (function() {
        var tabs = document.querySelectorAll('.login-tab');
        var forms = document.querySelectorAll('.login-form');
        var errorEl = document.getElementById('login-error');
        var successEl = document.getElementById('login-success');

        tabs.forEach(function(tab) {
            tab.addEventListener('click', function() {
                tabs.forEach(function(t) { t.classList.remove('active'); });
                forms.forEach(function(f) { f.classList.remove('active'); });
                tab.classList.add('active');
                document.getElementById(tab.dataset.form).classList.add('active');
                errorEl.style.display = 'none';
                successEl.style.display = 'none';
            });
        });

        function showError(msg) {
            errorEl.textContent = msg;
            errorEl.style.display = 'block';
            successEl.style.display = 'none';
        }
        function showSuccess(msg) {
            successEl.textContent = msg;
            successEl.style.display = 'block';
            errorEl.style.display = 'none';
        }

        window.handleLogin = function(e) {
            e.preventDefault();
            var btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = 'Authenticating...';
            errorEl.style.display = 'none';

            var username = document.getElementById('login-username').value.trim();
            var password = document.getElementById('login-password').value;

            fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: username, password: password})
            })
            .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
            .then(function(res) {
                if (res.ok) {
                    if (res.data.is_founder) {
                        document.getElementById('login-card').classList.add('founder-glow');
                        showSuccess('Welcome home, Founder.');
                        setTimeout(function() { window.location.href = '/'; }, 1200);
                    } else {
                        showSuccess('Access granted.');
                        setTimeout(function() { window.location.href = '/'; }, 600);
                    }
                } else {
                    showError(res.data.error || 'Login failed');
                    btn.disabled = false;
                    btn.textContent = 'Enter the Vault';
                }
            })
            .catch(function() {
                showError('Connection failed');
                btn.disabled = false;
                btn.textContent = 'Enter the Vault';
            });
            return false;
        };

        window.handleRegister = function(e) {
            e.preventDefault();
            var btn = document.getElementById('reg-btn');
            btn.disabled = true;
            btn.textContent = 'Creating...';
            errorEl.style.display = 'none';

            var username = document.getElementById('reg-username').value.trim();
            var display = document.getElementById('reg-display').value.trim();
            var password = document.getElementById('reg-password').value;
            var confirm = document.getElementById('reg-confirm').value;

            if (password !== confirm) {
                showError('Passwords do not match');
                btn.disabled = false;
                btn.textContent = 'Create Account';
                return false;
            }

            fetch('/api/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: username,
                    display_name: display,
                    password: password,
                    confirm_password: confirm
                })
            })
            .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
            .then(function(res) {
                if (res.ok) {
                    showSuccess('Account created. Entering the vault...');
                    setTimeout(function() { window.location.href = '/'; }, 800);
                } else {
                    showError(res.data.error || 'Registration failed');
                    btn.disabled = false;
                    btn.textContent = 'Create Account';
                }
            })
            .catch(function() {
                showError('Connection failed');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            });
            return false;
        };
    })();
    </script>
    <script>
    (function() {
        var canvas = document.getElementById('blueprint-bg');
        var ctx = canvas.getContext('2d');

        var TEAL = '45,212,191';
        var GOLD = '201,168,76';

        var GLYPHS = [
            'σ','φ','ψ','Ω','λ','α','δ','θ','∞','∴','⊕','⊗','∇','∂','≡','⊥',
            '◆','⬡','△','⟨','⟩','∫','ε','ζ','μ','π','⚡','⌬','⌖','⊹','✦'
        ];
        var ANNOTS = [
            '432 Hz','Al-Jabr 286','LSB:2','VTX','VOID','NODE:7',
            'MESH:OK','σ·λ·∞','0xA3F9','0xC9A8','ADRIANA','SOVEREIGN',
            'DEPTH:2','HASH:OK','◆ 286','CARRIER','STEALTH'
        ];

        var W, H, t = 0, scanY = 0;
        var nodes = [], traces = [], glyphs = [], annots = [], hexes = [];

        function rand(min, max) { return min + Math.random() * (max - min); }
        function randInt(min, max) { return Math.floor(rand(min, max)); }
        function pickColor() { return Math.random() < 0.65 ? TEAL : GOLD; }

        function generate() {
            nodes = []; traces = []; glyphs = []; annots = []; hexes = [];

            /* ── sparse circuit nodes ── */
            var step = 160;
            for (var gx = step; gx < W; gx += step) {
                for (var gy = step; gy < H; gy += step) {
                    if (Math.random() < 0.28) {
                        nodes.push({
                            x: gx + rand(-55, 55),
                            y: gy + rand(-55, 55),
                            r: rand(2.5, 5.5),
                            c: pickColor(),
                            ph: rand(0, Math.PI * 2)
                        });
                    }
                }
            }

            /* ── manhattan circuit traces between nearby nodes ── */
            for (var i = 0; i < nodes.length; i++) {
                for (var j = i + 1; j < nodes.length; j++) {
                    var dx = nodes[j].x - nodes[i].x;
                    var dy = nodes[j].y - nodes[i].y;
                    if (Math.sqrt(dx*dx + dy*dy) < 210 && Math.random() < 0.38) {
                        traces.push({ a: i, b: j, c: pickColor() });
                    }
                }
            }

            /* ── Adriana glyphs scattered across viewport ── */
            for (var g = 0; g < 35; g++) {
                glyphs.push({
                    x: rand(20, W - 20),
                    y: rand(20, H - 20),
                    ch: GLYPHS[randInt(0, GLYPHS.length)],
                    sz: rand(9, 20),
                    c: pickColor(),
                    op: rand(0.04, 0.13)
                });
            }

            /* ── technical annotations ── */
            for (var a = 0; a < 18; a++) {
                annots.push({
                    x: rand(10, W - 80),
                    y: rand(10, H - 10),
                    text: ANNOTS[randInt(0, ANNOTS.length)],
                    c: pickColor()
                });
            }

            /* ── hexagonal structures, biased toward corners & edges ── */
            var corners = [
                [rand(50,180),  rand(50,180)],
                [rand(W-180,W-50), rand(50,180)],
                [rand(50,180),  rand(H-180,H-50)],
                [rand(W-180,W-50), rand(H-180,H-50)],
                [rand(W*0.12,W*0.22), H*0.5 + rand(-60,60)],
                [rand(W*0.78,W*0.88), H*0.5 + rand(-60,60)],
                [W*0.5 + rand(-60,60), rand(H*0.06,H*0.14)],
                [W*0.5 + rand(-60,60), rand(H*0.86,H*0.94)],
                [rand(W*0.25,W*0.38), rand(H*0.12,H*0.25)],
                [rand(W*0.62,W*0.75), rand(H*0.12,H*0.25)],
                [rand(W*0.25,W*0.38), rand(H*0.75,H*0.88)],
                [rand(W*0.62,W*0.75), rand(H*0.75,H*0.88)]
            ];
            corners.forEach(function(pos) {
                hexes.push({
                    x: pos[0], y: pos[1],
                    r: rand(18, 42),
                    c: pickColor(),
                    ph: rand(0, Math.PI * 2),
                    rings: randInt(1, 3)
                });
            });
        }

        function drawHex(cx, cy, r, color, op) {
            ctx.beginPath();
            for (var i = 0; i < 6; i++) {
                var angle = Math.PI / 3 * i - Math.PI / 6;
                var px = cx + r * Math.cos(angle);
                var py = cy + r * Math.sin(angle);
                i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.strokeStyle = 'rgba(' + color + ',' + op + ')';
            ctx.lineWidth = 0.7;
            ctx.stroke();
        }

        function drawCornerBracket(x, y, sz, corner) {
            var s = sz / 2;
            ctx.strokeStyle = 'rgba(' + GOLD + ',0.28)';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            if (corner === 0) { ctx.moveTo(x+s,y); ctx.lineTo(x,y); ctx.lineTo(x,y+s); }
            if (corner === 1) { ctx.moveTo(x-s,y); ctx.lineTo(x,y); ctx.lineTo(x,y+s); }
            if (corner === 2) { ctx.moveTo(x+s,y); ctx.lineTo(x,y); ctx.lineTo(x,y-s); }
            if (corner === 3) { ctx.moveTo(x-s,y); ctx.lineTo(x,y); ctx.lineTo(x,y-s); }
            ctx.stroke();
            /* small dot at corner tip */
            ctx.beginPath();
            ctx.arc(x, y, 2.5, 0, Math.PI*2);
            ctx.fillStyle = 'rgba(' + GOLD + ',0.35)';
            ctx.fill();
        }

        function frame() {
            ctx.clearRect(0, 0, W, H);
            t += 0.007;
            scanY = (scanY + 0.45) % H;

            /* ── fine grid ── */
            ctx.strokeStyle = 'rgba(' + TEAL + ',0.04)';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            for (var gx = 0; gx < W; gx += 50) { ctx.moveTo(gx,0); ctx.lineTo(gx,H); }
            for (var gy = 0; gy < H; gy += 50) { ctx.moveTo(0,gy); ctx.lineTo(W,gy); }
            ctx.stroke();

            /* ── major grid ── */
            ctx.strokeStyle = 'rgba(' + TEAL + ',0.085)';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            for (var mx = 0; mx < W; mx += 250) { ctx.moveTo(mx,0); ctx.lineTo(mx,H); }
            for (var my = 0; my < H; my += 250) { ctx.moveTo(0,my); ctx.lineTo(W,my); }
            ctx.stroke();

            /* ── corner brackets ── */
            var bp = 28, bs = 56;
            drawCornerBracket(bp, bp, bs, 0);
            drawCornerBracket(W-bp, bp, bs, 1);
            drawCornerBracket(bp, H-bp, bs, 2);
            drawCornerBracket(W-bp, H-bp, bs, 3);

            /* ── circuit traces (manhattan routing) ── */
            traces.forEach(function(tr) {
                var a = nodes[tr.a], b = nodes[tr.b];
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(a.x, b.y);
                ctx.lineTo(b.x, b.y);
                ctx.strokeStyle = 'rgba(' + tr.c + ',0.085)';
                ctx.lineWidth = 0.7;
                ctx.stroke();
            });

            /* ── nodes with pulsing crosshairs ── */
            nodes.forEach(function(n) {
                var pulse = 0.5 + 0.5 * Math.sin(t * 1.6 + n.ph);
                var op = 0.09 + pulse * 0.16;
                ctx.strokeStyle = 'rgba(' + n.c + ',' + op + ')';
                ctx.fillStyle   = 'rgba(' + n.c + ',' + (op * 0.25) + ')';
                ctx.lineWidth = 0.8;
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
                ctx.fill(); ctx.stroke();
                /* crosshair */
                ctx.beginPath();
                ctx.moveTo(n.x - n.r*2.2, n.y); ctx.lineTo(n.x + n.r*2.2, n.y);
                ctx.moveTo(n.x, n.y - n.r*2.2); ctx.lineTo(n.x, n.y + n.r*2.2);
                ctx.stroke();
            });

            /* ── hexagonal structures ── */
            hexes.forEach(function(h) {
                var pulse = 0.5 + 0.5 * Math.sin(t * 0.9 + h.ph);
                for (var ring = 0; ring < h.rings; ring++) {
                    drawHex(h.x, h.y, h.r * (1 + ring * 0.65), h.c, (0.05 + pulse * 0.07) / (ring + 1));
                }
                /* centre dot */
                ctx.beginPath();
                ctx.arc(h.x, h.y, 2, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(' + h.c + ',' + (0.08 + pulse * 0.1) + ')';
                ctx.fill();
            });

            /* ── diamond shapes at mid-edge intersections ── */
            var diamonds = [
                {x: W*0.5, y: 40}, {x: W*0.5, y: H-40},
                {x: 40, y: H*0.5}, {x: W-40, y: H*0.5}
            ];
            diamonds.forEach(function(d) {
                var sz = 10;
                ctx.beginPath();
                ctx.moveTo(d.x, d.y - sz);
                ctx.lineTo(d.x + sz, d.y);
                ctx.lineTo(d.x, d.y + sz);
                ctx.lineTo(d.x - sz, d.y);
                ctx.closePath();
                ctx.strokeStyle = 'rgba(' + GOLD + ',0.22)';
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            /* ── Adriana glyphs ── */
            glyphs.forEach(function(g) {
                ctx.font = g.sz + "px 'SF Mono','Fira Code',monospace";
                ctx.fillStyle = 'rgba(' + g.c + ',' + g.op + ')';
                ctx.fillText(g.ch, g.x, g.y);
            });

            /* ── technical annotations ── */
            annots.forEach(function(a) {
                ctx.font = "8px 'SF Mono','Fira Code',monospace";
                ctx.fillStyle = 'rgba(' + a.c + ',0.11)';
                ctx.fillText(a.text, a.x, a.y);
            });

            /* ── scan line ── */
            var scanGrad = ctx.createLinearGradient(0, scanY - 50, 0, scanY + 50);
            scanGrad.addColorStop(0,   'rgba(' + TEAL + ',0)');
            scanGrad.addColorStop(0.5, 'rgba(' + TEAL + ',0.045)');
            scanGrad.addColorStop(1,   'rgba(' + TEAL + ',0)');
            ctx.fillStyle = scanGrad;
            ctx.fillRect(0, scanY - 50, W, 100);

            requestAnimationFrame(frame);
        }

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }

        function init() {
            resize();
            generate();
            requestAnimationFrame(frame);
        }

        /* regenerate layout on resize (throttled) */
        var resizeTimer;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(function() { resize(); generate(); }, 300);
        });

        init();
    })();
    </script>
    <script src="/static/resonance_visualizer.js"></script>
    <script>
    (function() {
        if (typeof ResonanceField === 'undefined') return;
        var bg = document.createElement('div');
        bg.id = 'login-resonance-bg';
        bg.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;';
        document.body.insertBefore(bg, document.body.firstChild);
        var rf = new ResonanceField(bg, { founder: false });
        rf.canvas.style.opacity = '0.4';
        function ambientPulse() {
            var seed = '';
            for (var i = 0; i < 16; i++) seed += Math.floor(Math.random() * 16).toString(16);
            rf.activate(seed, 'ambient');
            setTimeout(function() {
                rf.active = false;
            }, 3000);
            setTimeout(ambientPulse, 5000 + Math.random() * 3000);
        }
        setTimeout(ambientPulse, 1500);

        var origLogin = window.handleLogin;
        window.handleLogin = function(e) {
            var result = origLogin(e);
            return result;
        };

        var origSuccess = null;
        var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(m) {
                if (m.target.id === 'login-card' && m.target.classList.contains('founder-glow')) {
                    rf.opts.founder = true;
                    rf.isFounder = true;
                    rf.canvas.style.opacity = '0.8';
                    for (var i = 0; i < 3; i++) {
                        setTimeout(function() { rf.pulseHash('c9a84cfounder432adriana'); }, i * 400);
                    }
                }
            });
        });
        var card = document.getElementById('login-card');
        if (card) observer.observe(card, { attributes: true, attributeFilter: ['class'] });
    })();
    </script>
</body>
</html>
